apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ${KUSTOMIZER}-${IMAGEN}
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
#        run.googleapis.com/network-interfaces: '[{"network":"servicios-1","subnetwork":"servicios-1"}]' # Se ajusta desde los labels del proyecto de GC
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/execution-environment: gen2
    #        run.googleapis.com/vpc-access-connector: projects/${PROJECT_ID}/locations/europe-west1/connectors/cloud-run
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          containers:
            - image: europe-west1-docker.pkg.dev/${PROJECT_ID}/${KUSTOMIZER}/${IMAGEN}:${VERSION}
              env:
                - name: DATADOG
                  value: "false"
                - name: ENTORNO
                  value: "${ENTORNO}"
                - name: ZONA
                  value: "${ZONA}"
              volumeMounts:
                - name: temporal
                  mountPath: "/usr/src/app/files/tmp/"
              resources:
                limits:
                  cpu: "1"
                  memory: "4096Mi"
          maxRetries: 3
          timeoutSeconds: 600
          volumes:
            - name: temporal
              emptyDir:
                medium: Memory
                sizeLimit: 1Gi
